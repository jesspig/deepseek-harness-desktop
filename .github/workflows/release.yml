# 跨平台自动打包发布:tag 触发(vX.Y.Z 与 X.Y.Z 均兼容)或手动指定已存在 tag。
# Windows x64 / Linux x64 / macOS x64(Intel)+ arm64(Apple Silicon)四 job 并行,
# 产物汇总发布 GitHub Release;tag 含 prerelease 后缀时自动标记为预发布。
# profile 模板使用仓库已提交版本(packages/desktop-profile/template),
# 上游 dsh 升级后本地重跑 generate-profile.mjs 并提交,发布流程不联网生成。
name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本 tag(如 v0.1.0),留空表示使用当前 ref
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 禁用 electron-builder 自动发布(tag 触发时其默认 onTagOrDraft 会重复建 Release),
  # 统一由下方 release job 的 softprops 步骤发布
  GH_TOKEN: ''

jobs:
  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 为 Intel x64 runner,macos-14 为 Apple Silicon arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-13
            platform: mac
            arch: x64
          - os: macos-14
            platform: mac
            arch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          cache: pnpm

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          # 缓存由 pnpm/action-setup 管理,此处不重复配置避免冲突
          node-version: 24

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 编译 bundle
        run: pnpm --filter @dsh-desktop/bundle build

      - name: 注入 tag 版本
        run: node apps/desktop/scripts/set-version.mjs "${{ inputs.tag || github.ref_name }}"

      # electron-builder 缓存按平台分目录缓存,key 随 lockfile 失效,
      # electron 版本升级时自动重建(Windows 与 POSIX 缓存位置不同)
      - name: 缓存 electron-builder(Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: '%LOCALAPPDATA%\electron-builder\Cache'
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}

      - name: 缓存 electron-builder(POSIX)
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}

      - name: 构建打包
        run: pnpm --filter @dsh-desktop/app dist

      - name: 上传产物(Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/release/*.exe
            build/release/*.blockmap
            build/release/latest.yml
          if-no-files-found: error
          retention-days: 1

      - name: 上传产物(Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/release/*.AppImage
            build/release/*.deb
            build/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

      - name: 上传产物(macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/release/*.dmg
            build/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}